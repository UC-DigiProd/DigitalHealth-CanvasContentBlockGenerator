        #outputArea { display: none; margin-top: 2em; }

</head>

    <label for="blockType">Select Content Block Type:</label>

        <option value="grid">CSS Grid Cards (Activities & Options)</option>
        <option value="list">Flexbox List Cards (Vocabulary & Related Items)</option>
    </select>
